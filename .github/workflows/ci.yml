name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  data:
    name: Data files (themes, benchmark sets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate themes against the JSON Schema
        run: |
          python - <<'PY'
          import json, pathlib, jsonschema
          schema = json.loads(pathlib.Path("themes/schema.json").read_text())
          for path in pathlib.Path("themes").glob("*/theme.json"):
              jsonschema.validate(json.loads(path.read_text()), schema)
              print("ok", path)
          PY
      - name: Benchmark sets are unchanged
        working-directory: research/emotion-benchmark
        run: md5sum -c MD5SUMS
