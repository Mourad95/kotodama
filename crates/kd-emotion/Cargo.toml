[package]
name = "kd-emotion"
description = "Typed-choice emotion engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ort"]
# ONNX Runtime embedder (`OrtEmbedder`) and the model bundle loader. Disable for the pure logic.
ort = ["dep:ort", "dep:tokenizers"]

[dependencies]
kd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
# ONNX Runtime is loaded at run time from `ORT_DYLIB_PATH` (no download at build time).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"], optional = true }
# Pure-Rust regex backend; the pruned tokenizer needs no regex but the crate wants one.
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"], optional = true }

[lints]
workspace = true
