[package]
name = "kd-fx"
description = "Theme data and effects engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# CPU reference renderer (ADR-0015): golden frames in CI and, later, GIF/WebP export.
cpu-render = ["dep:tiny-skia", "dep:skrifa"]
# Animated GIF export of stickers, to share them (ADR-0025).
gif-export = ["cpu-render", "dep:gif"]

[dependencies]
kd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny-skia = { version = "0.12", optional = true }
skrifa = { version = "0.49", optional = true }
gif = { version = "0.14", optional = true, default-features = false, features = ["color_quant", "std"] }

[[example]]
name = "render_frames"
required-features = ["cpu-render"]

[[example]]
name = "bench_render"
required-features = ["cpu-render"]

[[example]]
name = "manga_preview"
required-features = ["cpu-render"]

[lints]
workspace = true
