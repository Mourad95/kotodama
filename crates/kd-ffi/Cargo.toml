[package]
name = "kd-ffi"
description = "Public facade of the Rust core, exposed to Swift and Kotlin via UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
kd-core.workspace = true
kd-emotion.workspace = true
kd-fx.workspace = true
kd-grammar.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[features]
# Builds the `uniffi-bindgen` binary used by `apps/android/build-core.sh` (and the iOS script).
# Off by default so the mobile library never pulls the generator's dependencies.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[lints]
workspace = true
